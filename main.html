<!DOCTYPE html>
<html lang="zh-TW" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>庫存與叫貨管理系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        /* 隱藏 Chrome, Safari, Edge, Opera 的 number input 箭頭 */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        /* 隱藏 Firefox 的 number input 箭頭 */
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="h-full text-slate-800 flex flex-col justify-between select-none">

    <!-- Toast 訊息通知元件 -->
    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 opacity-0 pointer-events-none transform -translate-y-4">
        <div class="bg-slate-800/90 text-white text-sm px-4 py-2.5 rounded-full shadow-lg flex items-center space-x-2 backdrop-blur-sm">
            <i id="toast-icon" class="fas fa-check-circle text-emerald-400"></i>
            <span id="toast-msg">操作成功</span>
        </div>
    </div>

    <!-- 主內容區塊 (可滾動) -->
    <main class="flex-1 overflow-y-auto pb-24 max-w-md mx-auto w-full">
        
        <!-- ==================== 頁面 1: 今日叫貨與庫存登記 ==================== -->
        <section id="page-daily" class="p-4 space-y-4">
            <!-- 頁首與日期選擇器 -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3">
                <div class="flex items-center justify-between">
                    <div>
                        <h1 class="text-xl font-bold text-slate-800">每日庫存登記</h1>
                        <p class="text-xs text-slate-500 mt-0.5">自動對應可叫貨廠商與庫存比對</p>
                    </div>
                    <button id="btn-today" onclick="setToday()" class="text-xs bg-indigo-50 text-indigo-600 font-medium px-2.5 py-1.5 rounded-lg active:scale-95 transition-transform">
                        回到今天
                    </button>
                </div>

                <!-- 日期選擇 -->
                <div class="flex items-center space-x-2 bg-slate-50 p-2 rounded-xl border border-slate-200/80">
                    <button onclick="changeDate(-1)" class="w-8 h-8 rounded-lg bg-white shadow-sm flex items-center justify-center text-slate-600 active:bg-slate-100">
                        <i class="fas fa-chevron-left text-xs"></i>
                    </button>
                    <div class="flex-1 flex items-center justify-center space-x-2">
                        <i class="far fa-calendar-alt text-indigo-500 text-sm"></i>
                        <input type="date" id="selected-date" onchange="onDateChange()" class="bg-transparent font-semibold text-sm text-slate-700 outline-none cursor-pointer">
                        <span id="weekday-badge" class="text-xs px-2 py-0.5 rounded-full font-medium bg-slate-200 text-slate-600">
                            週一
                        </span>
                    </div>
                    <button onclick="changeDate(1)" class="w-8 h-8 rounded-lg bg-white shadow-sm flex items-center justify-center text-slate-600 active:bg-slate-100">
                        <i class="fas fa-chevron-right text-xs"></i>
                    </button>
                </div>

                <!-- 唯讀警告提示條 (當非當天時顯示) -->
                <div id="readonly-banner" class="hidden flex items-center justify-between text-xs bg-amber-50 text-amber-700 p-2.5 rounded-xl border border-amber-200/60">
                    <div class="flex items-center space-x-1.5">
                        <i class="fas fa-lock text-amber-500"></i>
                        <span>歷史紀錄已鎖定，僅供檢視無法編輯</span>
                    </div>
                </div>
            </div>

            <!-- 當天叫貨廠商與商品列表區域 -->
            <div id="vendor-list-container" class="space-y-4">
                <!-- 動態注入廠商商品卡片 -->
            </div>
        </section>

        <!-- ==================== 頁面 2: 廠商與商品設定 ==================== -->
        <section id="page-settings" class="p-4 space-y-4 hidden">
            <!-- 頁首與新增按鈕 -->
            <div class="flex items-center justify-between bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <div>
                    <h1 class="text-xl font-bold text-slate-800">廠商與商品設定</h1>
                    <p class="text-xs text-slate-500 mt-0.5">管理廠商可叫貨星期與商品清單</p>
                </div>
                <button onclick="openVendorModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-3 py-2 rounded-xl shadow-sm flex items-center space-x-1.5 active:scale-95 transition-transform">
                    <i class="fas fa-plus"></i>
                    <span>新增廠商</span>
                </button>
            </div>

            <!-- 廠商列表區 -->
            <div id="settings-vendor-list" class="space-y-4">
                <!-- 動態注入廠商設定卡片 -->
            </div>
        </section>

    </main>

    <!-- 底部 Tab 導覽列 -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-200/80 z-40 max-w-md mx-auto">
        <div class="flex justify-around items-center h-16">
            <button id="nav-daily" onclick="switchTab('daily')" class="flex-1 flex flex-col items-center justify-center space-y-1 text-indigo-600">
                <i class="fas fa-clipboard-check text-lg"></i>
                <span class="text-xs font-medium">今日登記</span>
            </button>
            <button id="nav-settings" onclick="switchTab('settings')" class="flex-1 flex flex-col items-center justify-center space-y-1 text-slate-400">
                <i class="fas fa-sliders-h text-lg"></i>
                <span class="text-xs font-medium">廠商設定</span>
            </button>
        </div>
    </nav>

    <!-- Modal 彈窗: 新增/編輯廠商與商品 -->
    <div id="vendor-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 transition-opacity">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl max-h-[90vh] flex flex-col overflow-hidden shadow-2xl animate-in slide-in-from-bottom duration-200">
            <!-- Modal 頂部 -->
            <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                <h3 id="modal-title" class="font-bold text-slate-800 text-base">新增廠商資料</h3>
                <button onclick="closeVendorModal()" class="w-8 h-8 rounded-full bg-slate-200/60 text-slate-500 flex items-center justify-center active:bg-slate-200">
                    <i class="fas fa-times text-sm"></i>
                </button>
            </div>

            <!-- Modal 表單內容 (可滾動) -->
            <div class="p-5 overflow-y-auto space-y-5 flex-1">
                <input type="hidden" id="edit-vendor-id">

                <!-- 廠商名稱 -->
                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-slate-700">廠商名稱 <span class="text-rose-500">*</span></label>
                    <input type="text" id="input-vendor-name" placeholder="例如：A廠商 (蔬菜鮮果)" class="w-full px-3.5 py-2.5 text-sm bg-slate-50 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 focus:bg-white transition-colors">
                </div>

                <!-- 可叫貨星期 (多選) -->
                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-slate-700">可叫貨星期 (可多選) <span class="text-rose-500">*</span></label>
                    <div class="grid grid-cols-7 gap-1.5" id="weekday-selector">
                        <button type="button" onclick="toggleWeekday(1)" data-day="1" class="day-btn py-2 text-xs font-semibold rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50">一</button>
                        <button type="button" onclick="toggleWeekday(2)" data-day="2" class="day-btn py-2 text-xs font-semibold rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50">二</button>
                        <button type="button" onclick="toggleWeekday(3)" data-day="3" class="day-btn py-2 text-xs font-semibold rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50">三</button>
                        <button type="button" onclick="toggleWeekday(4)" data-day="4" class="day-btn py-2 text-xs font-semibold rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50">四</button>
                        <button type="button" onclick="toggleWeekday(5)" data-day="5" class="day-btn py-2 text-xs font-semibold rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50">五</button>
                        <button type="button" onclick="toggleWeekday(6)" data-day="6" class="day-btn py-2 text-xs font-semibold rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50">六</button>
                        <button type="button" onclick="toggleWeekday(0)" data-day="0" class="day-btn py-2 text-xs font-semibold rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50">日</button>
                    </div>
                </div>

                <!-- 商品品項列表 -->
                <div class="space-y-2 pt-2 border-t border-slate-100">
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-bold text-slate-700">商品項目與安全庫存</label>
                        <button type="button" onclick="addModalProductRow()" class="text-xs text-indigo-600 font-semibold hover:underline flex items-center space-x-1">
                            <i class="fas fa-plus text-[10px]"></i>
                            <span>新增商品</span>
                        </button>
                    </div>

                    <div id="modal-products-container" class="space-y-2.5">
                        <!-- 動態商品輸入欄位 -->
                    </div>
                </div>
            </div>

            <!-- Modal 底部按鈕 -->
            <div class="p-4 border-t border-slate-100 bg-slate-50/50 flex space-x-3">
                <button onclick="closeVendorModal()" class="flex-1 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-semibold rounded-xl">取消</button>
                <button onclick="saveVendorModal()" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-xl shadow-sm">儲存廠商</button>
            </div>
        </div>
    </div>

    <!-- JavaScript 業務邏輯 -->
    <script>
        // 預設範例資料 (若使用者 LocalStorage 無資料時載入)
        const DEFAULT_VENDORS = [
            {
                id: 'v_1',
                name: 'A廠商 (生鮮肉品)',
                days: [1, 3, 5], // 週一、三、五
                products: [
                    { id: 'p_101', name: '雞胸肉 (kg)', minStock: 10 },
                    { id: 'p_102', name: '梅花豬肉片 (kg)', minStock: 8 },
                    { id: 'p_103', name: '牛絞肉 (kg)', minStock: 5 },
                    { id: 'p_104', name: '鴨胸 (kg)', minStock: 4 },
                    { id: 'p_105', name: '培根 (包)', minStock: 15 },
                    { id: 'p_106', name: '豬肋排 (kg)', minStock: 6 },
                    { id: 'p_107', name: '雞腿肉 (kg)', minStock: 12 },
                    { id: 'p_108', name: '牛肉絲 (kg)', minStock: 8 },
                    { id: 'p_109', name: '羊肉片 (kg)', minStock: 3 },
                    { id: 'p_110', name: '松阪豬 (kg)', minStock: 5 }
                ]
            },
            {
                id: 'v_2',
                name: 'B廠商 (乳品雜貨)',
                days: [3, 6], // 週三、六
                products: [
                    { id: 'p_201', name: '鮮奶 (瓶)', minStock: 12 },
                    { id: 'p_202', name: '無鹽奶油 (盒)', minStock: 6 },
                    { id: 'p_203', name: '鮮奶油 (罐)', minStock: 4 },
                    { id: 'p_204', name: '起司片 (包)', minStock: 10 },
                    { id: 'p_205', name: '原味優格 (桶)', minStock: 5 }
                ]
            }
        ];

        // 應用程式狀態 (State)
        let appState = {
            vendors: [],
            records: {}, // 結構: { "2026-09-10": { "p_101": 8, "p_102": 15 } }
            currentDateStr: '', // "YYYY-MM-DD"
            selectedDays: []    // 用於 Modal 編輯廠商時暫存星期選擇
        };

        window.onload = function() {
            initData();
            setToday();
            renderSettingsPage();
        };

        // 初始化 LocalStorage 資料
        function initData() {
            const savedVendors = localStorage.getItem('vendor_app_vendors');
            if (savedVendors) {
                try {
                    appState.vendors = JSON.parse(savedVendors);
                } catch (e) {
                    appState.vendors = DEFAULT_VENDORS;
                }
            } else {
                appState.vendors = DEFAULT_VENDORS;
                saveVendorsToStorage();
            }

            const savedRecords = localStorage.getItem('vendor_app_records');
            if (savedRecords) {
                try {
                    appState.records = JSON.parse(savedRecords);
                } catch (e) {
                    appState.records = {};
                }
            }
        }

        function saveVendorsToStorage() {
            localStorage.setItem('vendor_app_vendors', JSON.stringify(appState.vendors));
        }

        function saveRecordsToStorage() {
            localStorage.setItem('vendor_app_records', JSON.stringify(appState.records));
        }

        // 取得今日 YYYY-MM-DD 格式
        function getTodayStr() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // 設定日期為今天
        function setToday() {
            const today = getTodayStr();
            document.getElementById('selected-date').value = today;
            onDateChange();
        }

        // 增減日期
        function changeDate(daysOffset) {
            const dateInput = document.getElementById('selected-date');
            if (!dateInput.value) return;

            const currentDate = new Date(dateInput.value);
            currentDate.setDate(currentDate.getDate() + daysOffset);

            const year = currentDate.getFullYear();
            const month = String(currentDate.getMonth() + 1).padStart(2, '0');
            const day = String(currentDate.getDate()).padStart(2, '0');
            dateInput.value = `${year}-${month}-${day}`;

            onDateChange();
        }

        // 日期變更處理
        function onDateChange() {
            const dateInput = document.getElementById('selected-date');
            const dateStr = dateInput.value;
            if (!dateStr) return;

            appState.currentDateStr = dateStr;

            // 計算星期幾 (0=日, 1=一, ... 6=六)
            const dateObj = new Date(dateStr + 'T00:00:00'); // 避免時區偏差
            const dayOfWeek = dateObj.getDay();

            // 更新星期 Badge
            const weekNames = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
            document.getElementById('weekday-badge').textContent = weekNames[dayOfWeek];

            // 判斷是否為唯讀 (選擇的日期早於今天)
            const todayStr = getTodayStr();
            const isHistorical = dateStr < todayStr;
            const readonlyBanner = document.getElementById('readonly-banner');

            if (isHistorical) {
                readonlyBanner.classList.remove('hidden');
            } else {
                readonlyBanner.classList.add('hidden');
            }

            // 渲染今日叫貨廠商與商品
            renderDailyPage(dayOfWeek, isHistorical);
        }

        // 切換頁面 Tab
        function switchTab(tab) {
            const pageDaily = document.getElementById('page-daily');
            const pageSettings = document.getElementById('page-settings');
            const navDaily = document.getElementById('nav-daily');
            const navSettings = document.getElementById('nav-settings');

            if (tab === 'daily') {
                pageDaily.classList.remove('hidden');
                pageSettings.classList.add('hidden');

                navDaily.className = 'flex-1 flex flex-col items-center justify-center space-y-1 text-indigo-600';
                navSettings.className = 'flex-1 flex flex-col items-center justify-center space-y-1 text-slate-400';
                
                // 重新載入，確保設定頁修改後資料同步
                onDateChange();
            } else {
                pageDaily.classList.add('hidden');
                pageSettings.classList.remove('hidden');

                navDaily.className = 'flex-1 flex flex-col items-center justify-center space-y-1 text-slate-400';
                navSettings.className = 'flex-1 flex flex-col items-center justify-center space-y-1 text-indigo-600';
                
                renderSettingsPage();
            }
        }

        // 渲染每日庫存頁面
        function renderDailyPage(dayOfWeek, isReadOnly) {
            const container = document.getElementById('vendor-list-container');
            container.innerHTML = '';

            // 篩選當天可以叫貨的廠商
            const availableVendors = appState.vendors.filter(v => v.days.includes(dayOfWeek));

            if (availableVendors.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl p-8 text-center border border-slate-100 space-y-3">
                        <div class="w-12 h-12 bg-slate-100 rounded-full flex items-center justify-center mx-auto text-slate-400">
                            <i class="fas fa-calendar-times text-xl"></i>
                        </div>
                        <h3 class="font-bold text-slate-700">本日無需叫貨廠商</h3>
                        <p class="text-xs text-slate-400">當天沒有排定可進貨的廠商。您可以在「廠商設定」中調整叫貨星期。</p>
                    </div>
                `;
                return;
            }

            const dayRecords = appState.records[appState.currentDateStr] || {};

            availableVendors.forEach(vendor => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3';

                let productsHTML = '';
                
                vendor.products.forEach(prod => {
                    const currentVal = dayRecords[prod.id] !== undefined ? dayRecords[prod.id] : '';
                    const isLowStock = currentVal !== '' && Number(currentVal) <= prod.minStock;

                    productsHTML += `
                        <div class="flex items-center justify-between py-2 border-b border-slate-50 last:border-0">
                            <div class="flex-1 pr-2">
                                <div class="font-medium text-sm text-slate-800">${escapeHtml(prod.name)}</div>
                                <div class="text-[11px] text-slate-400">最低庫存: ${prod.minStock}</div>
                            </div>

                            <div class="flex items-center space-x-2">
                                <!-- 數字輸入框 -->
                                <div class="relative">
                                    <input 
                                        type="number" 
                                        pattern="[0-9]*" 
                                        inputmode="numeric"
                                        placeholder="未填" 
                                        value="${currentVal}"
                                        ${isReadOnly ? 'disabled' : ''}
                                        oninput="updateStock('${prod.id}', this.value, ${prod.minStock})"
                                        class="w-20 px-2.5 py-1.5 text-center font-bold text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 focus:bg-white disabled:bg-slate-100 disabled:text-slate-500 transition-colors"
                                    >
                                </div>

                                <!-- 警告圖示區 (寬度固定防止抖動) -->
                                <div id="warning-icon-${prod.id}" class="w-16 flex items-center justify-end">
                                    ${isLowStock ? `
                                        <span class="inline-flex items-center px-2 py-1 rounded-lg text-xs font-semibold bg-rose-50 text-rose-600 border border-rose-200/80 animate-pulse">
                                            <i class="fas fa-exclamation-triangle mr-1 text-[10px]"></i>補貨
                                        </span>
                                    ` : `
                                        <span class="text-xs text-slate-300 font-normal">正常</span>
                                    `}
                                </div>
                            </div>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="flex items-center justify-between pb-2 border-b border-slate-100">
                        <div class="flex items-center space-x-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-indigo-500"></span>
                            <h2 class="font-bold text-slate-800 text-base">${escapeHtml(vendor.name)}</h2>
                        </div>
                        <span class="text-xs px-2 py-0.5 bg-slate-100 text-slate-600 font-medium rounded-md">
                            ${vendor.products.length} 項商品
                        </span>
                    </div>
                    <div class="divide-y divide-slate-50">
                        ${productsHTML}
                    </div>
                `;

                container.appendChild(card);
            });
        }

        // 即時更新庫存數與警告圖示
        function updateStock(productId, value, minStock) {
            const dateStr = appState.currentDateStr;
            if (!appState.records[dateStr]) {
                appState.records[dateStr] = {};
            }

            if (value === '') {
                delete appState.records[dateStr][productId];
            } else {
                appState.records[dateStr][productId] = Number(value);
            }

            saveRecordsToStorage();

            // 即時更新 DOM 警告顯示
            const warningEl = document.getElementById(`warning-icon-${productId}`);
            if (warningEl) {
                const numVal = Number(value);
                const isLowStock = value !== '' && numVal <= minStock;

                if (isLowStock) {
                    warningEl.innerHTML = `
                        <span class="inline-flex items-center px-2 py-1 rounded-lg text-xs font-semibold bg-rose-50 text-rose-600 border border-rose-200/80 animate-pulse">
                            <i class="fas fa-exclamation-triangle mr-1 text-[10px]"></i>補貨
                        </span>
                    `;
                } else {
                    warningEl.innerHTML = `
                        <span class="text-xs text-slate-300 font-normal">正常</span>
                    `;
                }
            }
        }

        // 渲染設定頁面
        function renderSettingsPage() {
            const container = document.getElementById('settings-vendor-list');
            container.innerHTML = '';

            const weekNames = ['日', '一', '二', '三', '四', '五', '六'];

            appState.vendors.forEach(vendor => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3';

                // 標記星期按鈕
                const daysBadges = [1, 2, 3, 4, 5, 6, 0].map(d => {
                    const isSelected = vendor.days.includes(d);
                    return `
                        <span class="w-6 h-6 flex items-center justify-center text-[11px] font-medium rounded-full ${
                            isSelected ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-400'
                        }">
                            ${weekNames[d]}
                        </span>
                    `;
                }).join('');

                card.innerHTML = `
                    <div class="flex items-start justify-between">
                        <div>
                            <h3 class="font-bold text-slate-800 text-base">${escapeHtml(vendor.name)}</h3>
                            <div class="flex items-center space-x-1 mt-2">
                                ${daysBadges}
                            </div>
                        </div>
                        <div class="flex items-center space-x-1">
                            <button onclick="editVendor('${vendor.id}')" class="p-2 text-slate-500 hover:text-indigo-600 active:scale-95">
                                <i class="fas fa-pen text-sm"></i>
                            </button>
                            <button onclick="deleteVendor('${vendor.id}')" class="p-2 text-slate-500 hover:text-rose-600 active:scale-95">
                                <i class="fas fa-trash-alt text-sm"></i>
                            </button>
                        </div>
                    </div>

                    <!-- 商品簡覽 -->
                    <div class="bg-slate-50 rounded-xl p-3 space-y-1.5 border border-slate-100">
                        <div class="text-xs font-semibold text-slate-500 flex justify-between">
                            <span>品項名稱 (${vendor.products.length})</span>
                            <span>最低庫存</span>
                        </div>
                        <div class="divide-y divide-slate-200/60">
                            ${vendor.products.map(p => `
                                <div class="flex justify-between text-xs text-slate-700 py-1">
                                    <span>${escapeHtml(p.name)}</span>
                                    <span class="font-semibold text-slate-500">${p.minStock}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        // 開啟 Modal (新增/編輯)
        function openVendorModal(vendorId = null) {
            const modal = document.getElementById('vendor-modal');
            const title = document.getElementById('modal-title');
            const vendorNameInput = document.getElementById('input-vendor-name');
            const editIdInput = document.getElementById('edit-vendor-id');
            const productsContainer = document.getElementById('modal-products-container');

            productsContainer.innerHTML = '';
            appState.selectedDays = [];

            if (vendorId) {
                // 編輯模式
                const vendor = appState.vendors.find(v => v.id === vendorId);
                if (!vendor) return;

                title.textContent = '編輯廠商資料';
                editIdInput.value = vendor.id;
                vendorNameInput.value = vendor.name;
                appState.selectedDays = [...vendor.days];

                vendor.products.forEach(p => {
                    addModalProductRow(p.name, p.minStock);
                });
            } else {
                // 新增模式
                title.textContent = '新增廠商資料';
                editIdInput.value = '';
                vendorNameInput.value = '';
                appState.selectedDays = [1, 3, 5]; // 預設週一三五
                
                // 預設給一個空白列
                addModalProductRow();
            }

            updateWeekdayButtonsUI();
            modal.classList.remove('hidden');
        }

        function closeVendorModal() {
            document.getElementById('vendor-modal').classList.add('hidden');
        }

        // 切換星期選擇狀態
        function toggleWeekday(dayNum) {
            const index = appState.selectedDays.indexOf(dayNum);
            if (index > -1) {
                appState.selectedDays.splice(index, 1);
            } else {
                appState.selectedDays.push(dayNum);
            }
            updateWeekdayButtonsUI();
        }

        // 更新 Modal 星期按鈕外觀
        function updateWeekdayButtonsUI() {
            const buttons = document.querySelectorAll('#weekday-selector .day-btn');
            buttons.forEach(btn => {
                const day = Number(btn.getAttribute('data-day'));
                if (appState.selectedDays.includes(day)) {
                    btn.className = 'day-btn py-2 text-xs font-semibold rounded-lg bg-indigo-600 text-white border border-indigo-600 shadow-sm';
                } else {
                    btn.className = 'day-btn py-2 text-xs font-semibold rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50';
                }
            });
        }

        // 動態增加 Modal 中的商品輸入列
        function addModalProductRow(name = '', minStock = 5) {
            const container = document.getElementById('modal-products-container');
            const row = document.createElement('div');
            row.className = 'product-row flex items-center space-x-2';
            row.innerHTML = `
                <input type="text" placeholder="商品名稱" value="${escapeHtml(name)}" class="prod-name flex-1 px-3 py-2 text-xs bg-slate-50 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 focus:bg-white">
                <div class="flex items-center space-x-1">
                    <span class="text-[10px] text-slate-400">最低:</span>
                    <input type="number" min="0" placeholder="0" value="${minStock}" class="prod-min w-16 px-2 py-2 text-xs font-semibold text-center bg-slate-50 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 focus:bg-white">
                </div>
                <button type="button" onclick="this.parentElement.remove()" class="p-2 text-slate-400 hover:text-rose-500">
                    <i class="fas fa-times text-xs"></i>
                </button>
            `;
            container.appendChild(row);
        }

        // 儲存 Modal 表單
        function saveVendorModal() {
            const nameInput = document.getElementById('input-vendor-name').value.trim();
            const editId = document.getElementById('edit-vendor-id').value;

            if (!nameInput) {
                showToast('請輸入廠商名稱', 'error');
                return;
            }

            if (appState.selectedDays.length === 0) {
                showToast('請至少選擇一個可叫貨星期', 'error');
                return;
            }

            // 收集商品資料
            const productRows = document.querySelectorAll('.product-row');
            const products = [];

            productRows.forEach((row, index) => {
                const pName = row.querySelector('.prod-name').value.trim();
                const pMin = row.querySelector('.prod-min').value;

                if (pName) {
                    products.push({
                        id: 'p_' + Date.now() + '_' + index,
                        name: pName,
                        minStock: pMin !== '' ? Number(pMin) : 0
                    });
                }
            });

            if (products.length === 0) {
                showToast('請至少建立一項商品', 'error');
                return;
            }

            if (editId) {
                // 更新廠商
                const vendor = appState.vendors.find(v => v.id === editId);
                if (vendor) {
                    vendor.name = nameInput;
                    vendor.days = [...appState.selectedDays];
                    
                    // 保留舊 ID（若品項名相同），避免庫存紀錄失去連結，簡化處理直接替換或繼承
                    vendor.products = products;
                }
                showToast('廠商資料已更新');
            } else {
                // 新增廠商
                const newVendor = {
                    id: 'v_' + Date.now(),
                    name: nameInput,
                    days: [...appState.selectedDays],
                    products: products
                };
                appState.vendors.push(newVendor);
                showToast('成功新增廠商');
            }

            saveVendorsToStorage();
            closeVendorModal();
            renderSettingsPage();
        }

        // 編輯與刪除廠商
        function editVendor(id) {
            openVendorModal(id);
        }

        function deleteVendor(id) {
            if (confirm('確定要刪除此廠商及其商品設定嗎？')) {
                appState.vendors = appState.vendors.filter(v => v.id !== id);
                saveVendorsToStorage();
                renderSettingsPage();
                showToast('已刪除廠商');
            }
        }

        // Toast 提示框
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            const toastIcon = document.getElementById('toast-icon');

            toastMsg.textContent = message;

            if (type === 'error') {
                toastIcon.className = 'fas fa-exclamation-circle text-rose-400';
            } else {
                toastIcon.className = 'fas fa-check-circle text-emerald-400';
            }

            toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-4');
            }, 2000);
        }

        // HTML 轉義防 XSS
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }
    </script>
</body>
</html>
