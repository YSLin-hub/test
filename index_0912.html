<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>庫存叫貨與帳務管理系統</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (v9 Module via compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <!-- html2canvas for exporting image -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .tab-active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-20">

    <!-- 頂部標題列 -->
    <header class="bg-blue-600 text-white p-4 sticky top-0 z-30 shadow-md flex justify-between items-center">
        <h1 class="text-lg font-bold flex items-center gap-2">
            <i class="fas fa-boxes"></i> 庫存叫貨與帳務管理
        </h1>
        <div class="text-xs bg-blue-700 px-2.5 py-1 rounded-full text-blue-100 font-mono flex items-center gap-1.5" id="syncStatus">
            <i class="fas fa-spinner fa-spin"></i> 雲端連線中
        </div>
    </header>

    <!-- 主內容區 -->
    <main class="p-4 max-w-md mx-auto relative">
        <!-- 頁籤切換 -->
        <div class="flex border-b border-slate-200 mb-4 bg-white rounded-t-xl shadow-sm overflow-hidden">
            <button id="tabTodayBtn" onclick="switchTab('today')" class="flex-1 py-3 text-center text-xs sm:text-sm tab-active flex justify-center items-center gap-1">
                <i class="fas fa-calendar-day"></i> 今日叫貨
            </button>
            <button id="tabAccountingBtn" onclick="switchTab('accounting')" class="flex-1 py-3 text-center text-xs sm:text-sm text-slate-500 flex justify-center items-center gap-1">
                <i class="fas fa-calculator"></i> 帳務管理
            </button>
            <button id="tabSettingsBtn" onclick="switchTab('settings')" class="flex-1 py-3 text-center text-xs sm:text-sm text-slate-500 flex justify-center items-center gap-1">
                <i class="fas fa-cog"></i> 設定
            </button>
        </div>

        <!-- 頁籤 1: 今日叫貨登記頁 -->
        <section id="tabToday" class="relative">
            <!-- 跟隨滑軸移動的懸浮儲存按鈕 -->
            <div id="floatSaveBtnTodayContainer" class="sticky top-20 z-20 flex justify-end h-0 pointer-events-none mb-2">
                <button id="floatSaveBtnToday" onclick="manualSave()" title="儲存至雲端" class="pointer-events-auto bg-blue-600 hover:bg-blue-700 active:scale-95 text-white w-11 h-11 rounded-full shadow-lg flex items-center justify-center transition-all duration-200 border-2 border-white -mr-2 sm:-mr-4">
                    <i class="fas fa-cloud-upload-alt text-lg"></i>
                </button>
            </div>

            <!-- 日期選擇與叫貨卡片 -->
            <div class="bg-white p-3.5 rounded-xl shadow-sm mb-4 border border-slate-100 space-y-2.5">
                <div class="flex justify-between items-center">
                    <label class="text-xs text-slate-400">選擇查看日期</label>
                    <div class="flex items-center gap-2">
                        <button onclick="goToToday()" class="text-xs text-blue-600 hover:text-blue-800 bg-blue-50 px-2 py-0.5 rounded-md font-medium transition">
                            回到今天
                        </button>
                        <div id="readOnlyBadge" class="hidden px-2 py-0.5 bg-amber-50 text-amber-700 text-[11px] font-medium rounded-md border border-amber-200 flex items-center gap-1">
                            <i class="fas fa-lock text-amber-500"></i> 唯讀
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-between bg-slate-50 p-1.5 rounded-lg border border-slate-200">
                    <button onclick="changeDate(-1)" class="w-8 h-8 flex items-center justify-center text-slate-600 hover:bg-white rounded-md transition shadow-xs">
                        <i class="fas fa-chevron-left text-xs"></i>
                    </button>
                    <input type="date" id="targetDate" onchange="loadDateData()" class="text-sm font-semibold text-slate-700 bg-transparent focus:outline-none text-center">
                    <button onclick="changeDate(1)" class="w-8 h-8 flex items-center justify-center text-slate-600 hover:bg-white rounded-md transition shadow-xs">
                        <i class="fas fa-chevron-right text-xs"></i>
                    </button>
                </div>

                <div class="flex items-center gap-2 pt-0.5">
                    <div class="relative flex-1">
                        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                        <input type="text" id="searchInput" oninput="searchAndScrollToProduct()" placeholder="搜尋品項名稱..." class="w-full pl-8 pr-3 py-2 text-xs bg-slate-50 rounded-lg border border-slate-200 focus:bg-white focus:outline-none focus:border-blue-500">
                    </div>
                    <button onclick="generateOrderSummary()" class="text-xs text-white bg-emerald-600 hover:bg-emerald-700 px-3.5 py-2 rounded-lg font-medium transition flex items-center gap-1.5 shadow-xs whitespace-nowrap">
                        <i class="fas fa-shopping-cart text-xs"></i> 叫貨
                    </button>
                </div>
            </div>

            <!-- 叫貨清單 Modal -->
            <div id="orderModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center z-50 hidden p-4">
                <div class="bg-white w-full max-w-md rounded-2xl shadow-xl border border-slate-100 overflow-hidden flex flex-col max-h-[85vh]">
                    <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-emerald-50/50">
                        <h3 class="font-bold text-slate-800 flex items-center gap-2">
                            <i class="fas fa-clipboard-list text-emerald-600"></i> 低於庫存叫貨清單
                        </h3>
                        <button onclick="closeOrderModal()" class="text-slate-400 hover:text-slate-600">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div id="orderModalContent" class="p-4 overflow-y-auto space-y-4 flex-1 text-xs"></div>
<!-- 叫貨清單 Modal 底部按鈕區 -->
<div class="modal-footer flex justify-between items-center mt-4" style="padding: 15px; text-align: right; border-top: 1px solid #ddd;">
    <div>
        <button onclick="copyOrderText()" style="padding: 8px 16px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; margin-right: 8px;">複製文字</button>
        <button onclick="shareOrderLine()" style="padding: 8px 16px; background-color: #06C755; color: white; border: none; border-radius: 4px; cursor: pointer; margin-right: 8px;">傳送到 Line</button>
    </div>
    <button onclick="closeOrderModal()" style="padding: 8px 16px; background-color: #ccc; color: black; border: none; border-radius: 4px; cursor: pointer;">關閉</button>
</div>
                </div>
            </div>

            <!-- 叫貨清單列表 -->
            <div id="todaySupplierList" class="space-y-4"></div>

            <!-- 手動儲存按鈕 -->
            <div class="mt-6">
                <button id="saveBtn" onclick="manualSave()" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold py-3 px-4 rounded-xl shadow-md transition flex justify-center items-center gap-2">
                    <i class="fas fa-cloud-upload-alt"></i> 儲存至雲端
                </button>
            </div>
        </section>

        <!-- 頁籤 2: 帳務頁面 -->
        <section id="tabAccounting" class="hidden space-y-4 relative">
            <!-- 跟隨滑軸移動的懸浮儲存按鈕 -->
            <div id="floatSaveBtnAccContainer" class="sticky top-20 z-20 flex justify-end h-0 pointer-events-none mb-2">
                <button id="floatSaveBtnAcc" onclick="saveAccountingData()" title="儲存今日帳務" class="pointer-events-auto bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white w-11 h-11 rounded-full shadow-lg flex items-center justify-center transition-all duration-200 border-2 border-white -mr-2 sm:-mr-4">
                    <i class="fas fa-save text-lg"></i>
                </button>
            </div>

            <!-- 日期選擇卡片 -->
            <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-100 space-y-2.5">
                <div class="flex justify-between items-center">
                    <label class="text-xs text-slate-400">帳務日期</label>
                    <div class="flex items-center gap-2">
                        <button onclick="goToTodayAcc()" class="text-xs text-blue-600 hover:text-blue-800 bg-blue-50 px-2 py-0.5 rounded-md font-medium transition">
                            回到今天
                        </button>
						<!-- 【新增】解鎖補登按鈕，樣式與唯讀標籤保持一致的微型按鈕風格 -->
						<button id="unlockEditBtn" class="hidden text-xs text-amber-700 hover:text-amber-900 bg-amber-50 px-2 py-0.5 rounded-md border border-amber-200 font-medium transition flex items-center gap-1" onclick="toggleAccountingEdit()">
						<i class="fas fa-unlock"></i> 解鎖補登
						</button>
                        <div id="accReadOnlyBadge" class="hidden px-2 py-0.5 bg-amber-50 text-amber-700 text-[11px] font-medium rounded-md border border-amber-200 flex items-center gap-1">
                            <i class="fas fa-lock text-amber-500"></i> 唯讀
                        </div>
                    </div>
                </div>
                <div class="flex items-center justify-between bg-slate-50 p-1.5 rounded-lg border border-slate-200">
                    <button onclick="changeAccDate(-1)" class="w-8 h-8 flex items-center justify-center text-slate-600 hover:bg-white rounded-md transition shadow-xs">
                        <i class="fas fa-chevron-left text-xs"></i>
                    </button>
                    <input type="date" id="accTargetDate" onchange="handleAccDateChange()" class="text-sm font-semibold text-slate-700 bg-transparent focus:outline-none text-center">
                    <button onclick="changeAccDate(1)" class="w-8 h-8 flex items-center justify-center text-slate-600 hover:bg-white rounded-md transition shadow-xs">
                        <i class="fas fa-chevron-right text-xs"></i>
                    </button>
                </div>
            </div>

            <!-- 早班卡片 -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                <div class="flex justify-between items-center mb-3 border-b pb-2 border-slate-100">
                    <h3 class="font-bold text-sm text-amber-600 flex items-center gap-1.5">
                        <i class="fas fa-sun"></i> 早班結帳
                    </h3>
                    <select id="am_operator" onchange="updateSyncStatus(false)" class="text-xs bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 font-medium text-slate-700 focus:outline-none focus:border-blue-500">
                        <option value="">選擇經辦</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-3 text-xs">
                    <div>
                        <label class="text-slate-500 block mb-1">營收</label>
                        <input type="number" inputmode="decimal" id="am_rev" oninput="calcAccounting()" placeholder="0" class="acc-input w-full p-2 border border-slate-200 rounded-lg bg-slate-50 text-right font-semibold disabled:bg-slate-100">
                    </div>
                    <div>
                        <label class="text-slate-500 block mb-1">行動支付</label>
                        <input type="number" inputmode="decimal" id="am_pay" oninput="calcAccounting()" placeholder="0" class="acc-input w-full p-2 border border-slate-200 rounded-lg bg-slate-50 text-right font-semibold disabled:bg-slate-100">
                    </div>
                    <div>
                        <label class="text-slate-500 block mb-1">餐卷</label>
                        <input type="number" inputmode="decimal" id="am_ticket" oninput="calcAccounting()" placeholder="0" class="acc-input w-full p-2 border border-slate-200 rounded-lg bg-slate-50 text-right font-semibold disabled:bg-slate-100">
                    </div>
                    <div>
                        <label class="text-slate-500 block mb-1">賣餐卷</label>
                        <input type="number" inputmode="decimal" id="am_sell_ticket" oninput="calcAccounting()" placeholder="0" class="acc-input w-full p-2 border border-slate-200 rounded-lg bg-slate-50 text-right font-semibold disabled:bg-slate-100">
                    </div>
                    <div>
                        <label class="text-slate-500 block mb-1">支出</label>
                        <input type="number" inputmode="decimal" id="am_exp" oninput="calcAccounting()" placeholder="0" class="acc-input w-full p-2 border border-slate-200 rounded-lg bg-slate-50 text-right font-semibold disabled:bg-slate-100">
                    </div>
                    <div>
                        <label class="text-slate-700 font-bold block mb-1">回收現金 (自動)</label>
                        <input type="number" inputmode="decimal" id="am_cash" readonly class="w-full p-2 border border-amber-200 rounded-lg bg-amber-50 text-right font-bold text-amber-700">
                    </div>
                    <div>
                        <label class="text-slate-500 block mb-1">剩餘餐卷 (本)</label>
                        <input type="number" inputmode="decimal" id="am_rest_ticket" placeholder="0" class="w-full p-2 border border-slate-200 rounded-lg bg-slate-50 text-right font-semibold disabled:bg-slate-100">
                    </div>
                    <div class="col-span-2">
                        <label class="text-rose-600 font-bold block mb-1">支出項目</label>
                        <input type="text" id="am_exp_note" placeholder="可輸入支出中文說明..." class="w-full p-2 border border-slate-200 rounded-lg bg-slate-50 font-medium disabled:bg-slate-100">
                    </div>
                </div>
            </div>

            <!-- 晚班卡片 -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                <div class="flex justify-between items-center mb-3 border-b pb-2 border-slate-100">
                    <h3 class="font-bold text-sm text-indigo-600 flex items-center gap-1.5">
                        <i class="fas fa-moon"></i> 晚班結帳
                    </h3>
                    <select id="pm_operator" onchange="updateSyncStatus(false)" class="text-xs bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 font-medium text-slate-700 focus:outline-none focus:border-blue-500">
                        <option value="">選擇經辦</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-3 text-xs">
                    <div>
                        <label class="text-slate-500 block mb-1">營收</label>
                        <input type="number" inputmode="decimal" id="pm_rev" oninput="calcAccounting()" placeholder="0" class="acc-input w-full p-2 border border-slate-200 rounded-lg bg-slate-50 text-right font-semibold disabled:bg-slate-100">
                    </div>
                    <div>
                        <label class="text-slate-500 block mb-1">行動支付</label>
                        <input type="number" inputmode="decimal" id="pm_pay" oninput="calcAccounting()" placeholder="0" class="acc-input w-full p-2 border border-slate-200 rounded-lg bg-slate-50 text-right font-semibold disabled:bg-slate-100">
                    </div>
                    <div>
                        <label class="text-slate-500 block mb-1">餐卷</label>
                        <input type="number" inputmode="decimal" id="pm_ticket" oninput="calcAccounting()" placeholder="0" class="acc-input w-full p-2 border border-slate-200 rounded-lg bg-slate-50 text-right font-semibold disabled:bg-slate-100">
                    </div>
                    <div>
                        <label class="text-slate-500 block mb-1">賣餐卷</label>
                        <input type="number" inputmode="decimal" id="pm_sell_ticket" oninput="calcAccounting()" placeholder="0" class="acc-input w-full p-2 border border-slate-200 rounded-lg bg-slate-50 text-right font-semibold disabled:bg-slate-100">
                    </div>
                    <div>
                        <label class="text-slate-500 block mb-1">支出</label>
                        <input type="number" inputmode="decimal" id="pm_exp" oninput="calcAccounting()" placeholder="0" class="acc-input w-full p-2 border border-slate-200 rounded-lg bg-slate-50 text-right font-semibold disabled:bg-slate-100">
                    </div>
                    <div>
                        <label class="text-slate-700 font-bold block mb-1">回收現金 (自動)</label>
                        <input type="number" inputmode="decimal" id="pm_cash" readonly class="w-full p-2 border border-indigo-200 rounded-lg bg-indigo-50 text-right font-bold text-indigo-700">
                    </div>
                    <div>
                        <label class="text-slate-500 block mb-1">剩餘餐卷 (本)</label>
                        <input type="number" inputmode="decimal" id="pm_rest_ticket" placeholder="0" class="w-full p-2 border border-slate-200 rounded-lg bg-slate-50 text-right font-semibold disabled:bg-slate-100">
                    </div>
                    <div class="col-span-2">
                        <label class="text-rose-600 font-bold block mb-1">支出項目</label>
                        <input type="text" id="pm_exp_note" placeholder="可輸入支出中文說明..." class="w-full p-2 border border-slate-200 rounded-lg bg-slate-50 font-medium disabled:bg-slate-100">
                    </div>
                </div>
            </div>

            <!-- 整日結算卡片 -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                <h3 class="font-bold text-sm text-slate-800 mb-3 flex items-center gap-1.5 border-b pb-2 border-slate-100">
                    <i class="fas fa-chart-line text-blue-600"></i> 整日結算 (自動計算)
                </h3>
                <div class="grid grid-cols-2 gap-3 text-xs">
                    <div>
                        <label class="text-slate-500 block mb-1">總營收</label>
                        <input type="number" inputmode="decimal" id="day_rev" readonly class="w-full p-2 border border-slate-200 rounded-lg bg-slate-100 text-right font-semibold">
                    </div>
                    <div>
                        <label class="text-slate-500 block mb-1">總行動支付</label>
                        <input type="number" inputmode="decimal" id="day_pay" readonly class="w-full p-2 border border-slate-200 rounded-lg bg-slate-100 text-right font-semibold">
                    </div>
                    <div>
                        <label class="text-slate-500 block mb-1">總餐卷</label>
                        <input type="number" inputmode="decimal" id="day_ticket" readonly class="w-full p-2 border border-slate-200 rounded-lg bg-slate-100 text-right font-semibold">
                    </div>
                    <div>
                        <label class="text-slate-500 block mb-1">總賣餐卷</label>
                        <input type="number" inputmode="decimal" id="day_sell_ticket" readonly class="w-full p-2 border border-slate-200 rounded-lg bg-slate-100 text-right font-semibold">
                    </div>
                    <div>
                        <label class="text-slate-500 block mb-1">總支出</label>
                        <input type="number" inputmode="decimal" id="day_exp" readonly class="w-full p-2 border border-slate-200 rounded-lg bg-slate-100 text-right font-semibold">
                    </div>
                    <div>
                        <label class="text-slate-500 block mb-1">總回收現金</label>
                        <input type="number" inputmode="decimal" id="day_cash" readonly class="w-full p-2 border border-slate-200 rounded-lg bg-slate-100 text-right font-semibold">
                    </div>
                    <div class="col-span-2">
                        <label class="text-emerald-700 font-bold block mb-1">農產收入 (自行輸入)</label>
                        <input type="number" inputmode="decimal" id="day_farm" oninput="calcAccounting()" placeholder="0" class="w-full p-2 border border-emerald-300 rounded-lg bg-emerald-50 text-right font-bold text-emerald-800 disabled:bg-slate-100">
                    </div>
                </div>
            </div>

            <!-- 每日出納表卡片 -->
            <div class="bg-emerald-900 text-white p-4 rounded-xl shadow-md border border-emerald-800">
                <h3 class="font-bold text-sm text-emerald-200 mb-3 flex items-center gap-1.5 border-b pb-2 border-emerald-800">
                    <i class="fas fa-file-invoice-dollar"></i> 每日出納表
                </h3>
                <div class="grid grid-cols-2 gap-3 text-xs">
                    <div>
                        <label class="text-emerald-200 block mb-1">回收現金</label>
                        <input type="number" inputmode="decimal" id="stmt_cash" readonly class="w-full p-2 border border-emerald-700 rounded-lg bg-emerald-800/60 text-white text-right font-semibold">
                    </div>
                    <div>
                        <label class="text-emerald-200 block mb-1">農產收入</label>
                        <input type="number" inputmode="decimal" id="stmt_farm" readonly class="w-full p-2 border border-emerald-700 rounded-lg bg-emerald-800/60 text-white text-right font-semibold">
                    </div>
                    <div class="col-span-2">
                        <label class="text-emerald-200 font-bold block mb-1">回收總現金</label>
                        <input type="number" inputmode="decimal" id="stmt_total_cash" readonly class="w-full p-2 border border-emerald-700 rounded-lg bg-emerald-800 text-amber-300 text-right font-bold text-sm">
                    </div>
                    <div>
                        <label class="text-emerald-200 block mb-1">前一日餘額 (可編輯)</label>
                        <input type="number" inputmode="decimal" id="stmt_prev_bal" oninput="calcAccounting()" placeholder="0" class="w-full p-2 border border-emerald-700 rounded-lg bg-white text-slate-900 text-right font-bold disabled:bg-slate-200">
                    </div>
                    <div>
                        <label class="text-amber-300 font-bold block mb-1">廠商預留金</label>
                        <input type="number" inputmode="decimal" id="stmt_reserve" oninput="calcAccounting()" placeholder="0" class="w-full p-2 border border-amber-400 rounded-lg bg-white text-slate-900 text-right font-bold disabled:bg-slate-200">
                    </div>
                    <div>
                        <label class="text-emerald-200 block mb-1">存入金額 (以1000為單位)</label>
                        <input type="number" inputmode="decimal" id="stmt_deposit" readonly class="w-full p-2 border border-emerald-700 rounded-lg bg-emerald-800/60 text-emerald-300 text-right font-bold">
                    </div>
                    <div>
                        <label class="text-emerald-200 block mb-1">餘額 (帶入明日)</label>
                        <input type="number" inputmode="decimal" id="stmt_balance" readonly class="w-full p-2 border border-emerald-700 rounded-lg bg-emerald-800/60 text-amber-300 text-right font-bold">
                    </div>
                </div>
            </div>

            <!-- 帳務備註欄位 -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                <label class="text-slate-700 font-bold text-xs block mb-1.5 flex items-center gap-1.5">
                    <i class="fas fa-sticky-note text-amber-500"></i> 帳務備註
                </label>
                <textarea id="acc_remark" rows="3" placeholder="請在此輸入當日帳務備註事項..." class="w-full p-2.5 text-xs border border-slate-200 rounded-lg bg-slate-50 focus:bg-white focus:outline-none focus:border-blue-500 disabled:bg-slate-100 transition"></textarea>
            </div>

            <!-- 按鈕區：今日一覽 & 儲存帳務 -->
            <div class="mt-4 space-y-2">

    <!-- Toast 提示訊息 -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs px-4 py-2.5 rounded-full shadow-lg transition-all duration-300 opacity-0 pointer-events-none z-50 flex items-center gap-2">

    </div>

    <script>
        // Firebase 設定金鑰
        const firebaseConfig = {
            apiKey: "AIzaSyCGhcOptdGe2fCDquFcaB9c8E7WAzvny9k",
            authDomain: "uuhotpot-83e28.firebaseapp.com",
            databaseURL: "https://uuhotpot-83e28-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "uuhotpot-83e28",
            storageBucket: "uuhotpot-83e28.firebasestorage.app",
            messagingSenderId: "528623847738",
            appId: "1:528623847738:web:53408e3e555801098a6803",
            measurementId: "G-TRHQ18M6FZ"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        let currentUser = null;
        let isDbInitialized = false;

        let config = { suppliers: [], operators: [] };
        let currentDayLogs = {};
        let currentAccData = {};
        let currentTab = 'today';

        // 儲存當前 logs 監聽器 Ref，切換日期時需先取消監聽
        let currentLogsRef = null;

        const DEFAULT_SUPPLIERS = [
            {
                id: 'sup_a',
                name: 'A 廠商',
                days: [1, 3, 5],
				multiplierDays: {}, // 新增：特定星期調整倍率
                products: [
                    { id: 'p_a1', name: '商品 A1', minStock: 5 },
                    { id: 'p_a2', name: '商品 A2', minStock: 5 }
                ]
            }
        ];

        const DEFAULT_OPERATORS = [
            { id: 'op_1', name: '經辦一' },
            { id: 'op_2', name: '經辦二' }
        ];

        auth.onAuthStateChanged(user => {
            currentUser = user;
            updateAuthUI();

            if (user && !isDbInitialized) {
                isDbInitialized = true;
                setupDatabaseListeners();
            }
        });

        function init() {
            if (!auth.currentUser) {
                auth.signInAnonymously().catch(error => {
                    console.error("匿名登入失敗:", error);
                });
            }

            const todayStr = getTodayString();
            document.getElementById('targetDate').value = todayStr;
            document.getElementById('accTargetDate').value = todayStr;

            setInterval(autoSaveProcess, 60000);
        }

function setupDatabaseListeners() {
    // 監聽並從 Firebase Realtime Database 載入全域配置
    db.ref('config').on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
            config.suppliers = val.suppliers || DEFAULT_SUPPLIERS;
            config.operators = val.operators || DEFAULT_OPERATORS;
        } else {
            config = { suppliers: DEFAULT_SUPPLIERS, operators: DEFAULT_OPERATORS };
            if (auth.currentUser && !auth.currentUser.isAnonymous) {
                db.ref('config').set(config);
            }
        }
        renderTodayView();
        renderSettingsView();
        renderOperatorDropdowns();
        updateSyncStatus(true);
    });

    // 初始化載入對應日期的叫貨庫存與帳務資料
    loadDateData();
    loadAccountingData();
}

        function updateAuthUI() {
            const settingsTabBtn = document.getElementById('tabSettingsBtn');
            if (currentUser && !currentUser.isAnonymous) {
                settingsTabBtn.innerHTML = `<i class="fas fa-cog text-blue-600"></i> 設定 <span class="text-[10px] text-emerald-600 font-normal">(已登入/登出)</span>`;
            } else {
                settingsTabBtn.innerHTML = `<i class="fas fa-lock"></i> 設定`;
            }
        }

        function handleLogout() {
            if (confirm("確定要登出管理者身份嗎？")) {
                auth.signOut().then(() => {
                    showToast('已登出管理者帳號');
                    switchTab('today');
                });
            }
        }

        function openLoginModal() {
            document.getElementById('loginEmail').value = '';
            document.getElementById('loginPassword').value = '';
            document.getElementById('loginError').classList.add('hidden');
            document.getElementById('loginModal').classList.remove('hidden');
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.add('hidden');
        }

        function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const errorEl = document.getElementById('loginError');

            if (!email || !password) {
                errorEl.innerText = '請輸入 Email 與密碼';
                errorEl.classList.remove('hidden');
                return;
            }

            auth.signInWithEmailAndPassword(email, password)
                .then(() => {
                    closeLoginModal();
                    showToast('登入成功！');
                    switchTab('settings');
                })
                .catch((error) => {
                    console.error('登入失敗:', error);
                    errorEl.innerText = '登入失敗：帳號或密碼錯誤';
                    errorEl.classList.remove('hidden');
                });
        }

        function getTodayString() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function getPrevDateString(dateStr) {
            const d = new Date(dateStr + 'T00:00:00+08:00');
            d.setDate(d.getDate() - 1);
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function updateSyncStatus(isSynced) {
            const statusEl = document.getElementById('syncStatus');
            if (statusEl) {
                if (isSynced) {
                    statusEl.innerHTML = `<i class="fas fa-check-circle text-emerald-300"></i> 已同步`;
                } else {
                    statusEl.innerHTML = `<i class="fas fa-edit text-amber-300"></i> 編輯中...`;
                }
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2000);
        }

        function loadDateData() {
    const dateVal = document.getElementById('targetDate').value;

    // 切換日期前先卸載舊的 Firebase 監聽器，避免記憶體洩漏
    if (currentLogsRef) {
        currentLogsRef.off();
    }

    // 改用 Firebase Realtime Database 讀取指定日期的叫貨數值記錄
    currentLogsRef = db.ref('logs/' + dateVal);
    currentLogsRef.on('value', (snapshot) => {
        currentDayLogs = snapshot.val() || {};
        renderTodayView();
    });
}

        function switchTab(tab) {
            if (tab === 'settings') {
                if (!currentUser || currentUser.isAnonymous) {
                    openLoginModal();
                    return;
                } else {
                    if (currentTab === 'settings') {
                        handleLogout();
                        return;
                    }
                }
            }

            currentTab = tab;
            const todayTab = document.getElementById('tabToday');
            const accTab = document.getElementById('tabAccounting');
            const settingsTab = document.getElementById('tabSettings');
            
            const todayBtn = document.getElementById('tabTodayBtn');
            const accBtn = document.getElementById('tabAccountingBtn');
            const settingsBtn = document.getElementById('tabSettingsBtn');

            todayTab.classList.add('hidden');
            accTab.classList.add('hidden');
            settingsTab.classList.add('hidden');

            todayBtn.className = 'flex-1 py-3 text-center text-xs sm:text-sm text-slate-500 flex justify-center items-center gap-1';
            accBtn.className = 'flex-1 py-3 text-center text-xs sm:text-sm text-slate-500 flex justify-center items-center gap-1';

function loadAccountingData() {
    const dateVal = document.getElementById('accTargetDate').value;
    const todayStr = getTodayString();
    
    // 【修改】只有在「選過去日期」且「尚未手動解鎖」時才為唯讀
    const isHistorical = dateVal < todayStr;
    const isReadOnly = isHistorical && !isForceEditable; 
    const prevDateVal = getPrevDateString(dateVal);

    const accBadge = document.getElementById('accReadOnlyBadge');
    const accSaveBtn = document.getElementById('accSaveBtn');
    const floatSaveBtnAcc = document.getElementById('floatSaveBtnAcc');
    
    // 【新增】取得解鎖按鈕 DOM
    const unlockEditBtn = document.getElementById('unlockEditBtn');

    // 顯示「唯讀」標籤（只有選歷史日期且沒解鎖時才顯示）
    if (accBadge) accBadge.classList.toggle('hidden', !isReadOnly);
    
    // 【新增】控制「解鎖補登」按鈕：只有在「選歷史日期」時才出現，當天或未來則隱藏
    if (unlockEditBtn) {
        unlockEditBtn.classList.toggle('hidden', !isHistorical);
    }

    // 儲存按鈕的顯示控制（若為唯讀則隱藏，可編輯則顯示）
    if (accSaveBtn) accSaveBtn.classList.toggle('hidden', isReadOnly);
    if (floatSaveBtnAcc) floatSaveBtnAcc.classList.toggle('hidden', isReadOnly);

    db.ref('accounting/' + dateVal).once('value', (snapshot) => {
        currentAccData = snapshot.val() || {};

        if (currentAccData.stmt_prev_bal === undefined || currentAccData.stmt_prev_bal === '') {
            db.ref('accounting/' + prevDateVal).once('value', (prevSnap) => {
                const prevData = prevSnap.val() || {};
                currentAccData.stmt_prev_bal = prevData.stmt_balance || 0;
                fillAccountingForm(currentAccData);
                calcAccounting();
            });
        } else {
            fillAccountingForm(currentAccData);
            calcAccounting();
        }

        const accInputs = document.querySelectorAll('#tabAccounting input, #tabAccounting textarea, #tabAccounting select');
        accInputs.forEach(input => {
            if (!input.readOnly) {
                input.disabled = isReadOnly;
            }
        });
    });
}

        function fillAccountingForm(data) {
            const fields = [
                'am_operator', 'am_rev', 'am_pay', 'am_ticket', 'am_sell_ticket', 'am_exp', 'am_rest_ticket', 'am_exp_note',
                'pm_operator', 'pm_rev', 'pm_pay', 'pm_ticket', 'pm_sell_ticket', 'pm_exp', 'pm_rest_ticket', 'pm_exp_note',
                'day_farm', 'stmt_prev_bal', 'stmt_reserve', 'acc_remark'
            ];
            fields.forEach(field => {
                const el = document.getElementById(field);
                if (el) el.value = data[field] !== undefined ? data[field] : '';
            });
        }

        function calcAccounting() {
            const getNum = id => Number(document.getElementById(id).value || 0);

            const am_rev = getNum('am_rev');
            const am_pay = getNum('am_pay');
            const am_ticket = getNum('am_ticket');
            const am_sell_ticket = getNum('am_sell_ticket');
            const am_exp = getNum('am_exp');
            const am_cash = am_rev - am_pay - am_ticket + am_sell_ticket - am_exp;
            document.getElementById('am_cash').value = am_cash;

            const pm_rev = getNum('pm_rev');
            const pm_pay = getNum('pm_pay');
            const pm_ticket = getNum('pm_ticket');
            const pm_sell_ticket = getNum('pm_sell_ticket');
            const pm_exp = getNum('pm_exp');
            const pm_cash = pm_rev - pm_pay - pm_ticket + pm_sell_ticket - pm_exp;
            document.getElementById('pm_cash').value = pm_cash;

            const day_rev = am_rev + pm_rev;
            const day_pay = am_pay + pm_pay;
            const day_ticket = am_ticket + pm_ticket;
            const day_sell_ticket = am_sell_ticket + pm_sell_ticket;
            const day_exp = am_exp + pm_exp;
            const day_cash = am_cash + pm_cash;
            const day_farm = getNum('day_farm');

            document.getElementById('day_rev').value = day_rev;
            document.getElementById('day_pay').value = day_pay;
            document.getElementById('day_ticket').value = day_ticket;
            document.getElementById('day_sell_ticket').value = day_sell_ticket;
            document.getElementById('day_exp').value = day_exp;
            document.getElementById('day_cash').value = day_cash;

            const stmt_cash = day_cash;
            const stmt_farm = day_farm;
            const stmt_total_cash = stmt_cash + stmt_farm;
            const stmt_prev_bal = getNum('stmt_prev_bal');
            const stmt_reserve = getNum('stmt_reserve');

            const availableMoney = stmt_total_cash + stmt_prev_bal - stmt_reserve;
            const stmt_deposit = availableMoney > 0 ? Math.floor(availableMoney / 1000) * 1000 : 0;
            const stmt_balance = stmt_total_cash + stmt_prev_bal - stmt_deposit - stmt_reserve;

            document.getElementById('stmt_cash').value = stmt_cash;
            document.getElementById('stmt_farm').value = stmt_farm;
            document.getElementById('stmt_total_cash').value = stmt_total_cash;
            document.getElementById('stmt_deposit').value = stmt_deposit;
            document.getElementById('stmt_balance').value = stmt_balance;

            updateSyncStatus(false);
        }

		function saveSupplierConfig() {
    const id = document.getElementById('modalSupplierId').value;
    const name = document.getElementById('modalSupplierName').value.trim();
    const note = document.getElementById('supplierModalNote').value.trim();
    if (!name) { alert('請輸入廠商名稱'); return; }

    const days = [];
    document.querySelectorAll('#modalWeekdays input[type="checkbox"]:checked').forEach(cb => days.push(Number(cb.value)));
    if (days.length === 0) { alert('請至少選擇一天可叫貨星期'); return; }

    // 收集倍率星期勾選與倍率數值
    const multiplierDays = [];
    document.querySelectorAll('#multiplierWeekdays input[type="checkbox"]:checked').forEach(cb => multiplierDays.push(Number(cb.value)));
    
    const mValInput = document.getElementById('supplierMultiplierVal').value.trim();
    const multiplierVal = mValInput !== '' ? Number(mValInput) : 1;

    const products = [];
    const rows = document.querySelectorAll('#modalProductsContainer .product-row');
    rows.forEach((row, idx) => {
        const pName = row.querySelector('.prod-name').value.trim();
        const pMin = row.querySelector('.prod-min').value;
        const existingId = row.dataset.prodId;
        if (pName) {
            products.push({
                id: existingId ? existingId : ('p_' + Date.now() + '_' + idx),
                name: pName,
                minStock: pMin !== '' ? Number(pMin) : 0
            });
        }
    });

    if (products.length === 0) { alert('請至少新增一項商品'); return; }
    if (!config.suppliers) config.suppliers = [];

    const supplierData = {
        id: id ? id : ('sup_' + Date.now()),
        name,
        note,
        days,
        multiplierDays,
        multiplierVal,
        products
    };

    if (id) {
        const index = config.suppliers.findIndex(s => s.id === id);
        if (index !== -1) config.suppliers[index] = supplierData;
    } else {
        config.suppliers.push(supplierData);
    }

    db.ref('config').set(config).then(() => {
        closeSupplierModal();
        showToast('雲端設定已儲存');
    });
}

                                <span class="text-[10px] bg-rose-100 text-rose-700 px-1.5 py-0.5 rounded-full font-normal">${lowStockProducts.length} 項需叫貨</span>
                            </div>
                            <div class="space-y-0.5">${itemsHtml}</div>
                        `;
                        container.appendChild(groupEl);
                    }
                });
            }

            if (!hasItemsToOrder) {
                container.innerHTML = `
                    <div class="text-center py-8 text-slate-400">
                        <i class="fas fa-check-circle text-emerald-500 text-3xl mb-2 block"></i>
                        目前沒有低於最低庫存的商品，無需叫貨！
                    </div>
                `;
            }

            const modal = document.getElementById('orderModal');
            if (modal) modal.classList.remove('hidden');
        }

        function searchAndScrollToProduct() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const items = document.querySelectorAll('.product-item');

            items.forEach(item => item.classList.remove('bg-amber-100', 'bg-amber-50'));
            if (!query) return;

            let found = false;
            items.forEach(item => {
                const name = (item.dataset.prodName || '').toLowerCase();
                if (!found && name.includes(query)) {
                    found = true;
                    item.classList.add('bg-amber-100');
                    const yOffset = -140; 
                    const y = item.getBoundingClientRect().top + window.pageYOffset + yOffset;
                    window.scrollTo({ top: y, behavior: 'smooth' });
                    const input = item.querySelector('input');
                    if (input) input.focus();
                }
            });
        }

        window.onload = init;
		
// 傳送到 Line
function shareOrderLine() {
    const container = document.getElementById('orderModalContent');
    if (!container) return;
    
    const rawText = container.innerText;
    const formattedText = formatOrderText(rawText);
    
    // 透過 Line 通用分享網址帶入格式化後的文字
    const lineUrl = `https://line.me/R/msg/text/?${encodeURIComponent(formattedText)}`;
    window.open(lineUrl, '_blank');
}

// 複製叫貨清單文字
function copyOrderText() {
    const container = document.getElementById('orderModalContent');
    if (!container) return;
    
    // 取得原始文字
    const rawText = container.innerText;
    
    // 進行格式轉換
    const formattedText = formatOrderText(rawText);
    
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(formattedText).then(() => {
            alert('已成功複製叫貨清單！');
        }).catch(err => {
            console.error('複製失敗，嘗試備用方法', err);
            fallbackCopyText(formattedText);
        });
    } else {
        fallbackCopyText(formattedText);
    }
}


// 輔助函式：將文字轉換成指定格式（廠商之間多空一行）
function formatOrderText(text) {
    const lines = text.split('\n');
    let result = [];
    let currentItem = '';

    for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        if (!line) continue;

        // 略過標題與不需要的資訊
        if (line.includes('項需叫貨') || line.includes('目前:')) {
            if (line.includes('目前:')) {
                // 修正：將原本的 current: 改為目前: 以符合實際文字
                let match = line.match(/目前:\s*([^\s(]+)/);
                if (match && currentItem) {
                    result.push(`${currentItem} 目前: ${match[1]}`);
                    currentItem = '';
                }
            }
            continue;
        }

        // 判斷是否為項目名稱（如果下一行是「目前:」，代表這行是品名）
        if (i + 1 < lines.length && lines[i + 1].includes('目前:')) {
            currentItem = line;
        } else {
            // 如果這是新的廠商標題，且前面已經有資料，就先塞入一個空行
            if (result.length > 0) {
                result.push('');
            }
            // 加上 📌 與廠商名稱
            result.push('📌 ' + line);
        }
    }

    return result.join('\n');
}
    
	// 【新增】全域變數：記錄目前是否已透過認證強制解鎖編輯
let isForceEditable = false;

// 【新增】點擊解鎖按鈕時執行的 Firebase 身分檢查函數
function toggleAccountingEdit() {
    const user = auth.currentUser;
    
    // 檢查是否為匿名登入或未登入
    if (!user || user.isAnonymous) {
        alert('權限不足：匿名訪客或未登入帳號無法解鎖補登！');
        return;
    }

    isForceEditable = !isForceEditable;
    const btn = document.getElementById('unlockEditBtn');
    if (btn) {
        btn.textContent = isForceEditable ? '🔒 鎖定唯讀' : '🔓 解鎖補登';
        btn.classList.toggle('btn-outline-warning', !isForceEditable);
        btn.classList.toggle('btn-warning', isForceEditable);
    }
    
    // 重新載入帳務資料以套用解鎖後的編輯狀態
    loadAccountingData();
}
function handleAccDateChange() {
    // 重置解鎖狀態
    isForceEditable = false;

    // 恢復解鎖按鈕的預設文字與樣式
    const unlockBtn = document.getElementById('unlockEditBtn');
    if (unlockBtn) {
        unlockBtn.textContent = '🔓 解鎖補登';
        unlockBtn.classList.remove('btn-warning');
        unlockBtn.classList.add('btn-outline-warning');
    }

    // 載入新日期的帳務資料與權限狀態
    loadAccountingData();
}	
	
	function getAdjustedMinStock(supplier, product, targetDate = new Date()) {
    const baseMinStock = product.minStock || 0;
    const currentDay = targetDate.getDay(); // 0(週日) 到 6(週六)
    
    if (supplier.multiplierDays && supplier.multiplierDays.includes(currentDay)) {
        const multiplier = Number(supplier.multiplierVal) || 1;
        return Math.round(baseMinStock * multiplier * 10) / 10;
    }
    
    return baseMinStock;
}
